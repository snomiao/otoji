<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" href="/otoji.svg" type="image/svg+xml" />
    <title>otoji</title>
    <style>
      /* Kill the default body margin so the full-bleed graph canvas (height:100vh)
         reaches every edge. Scrollable pages (classic app / lobby) keep normal flow. */
      html, body, #root { margin: 0; padding: 0; }
      html, body { background: #0d1117; }
      /* Stop the touchpad two-finger horizontal pan from triggering the browser's
         back/forward swipe navigation. */
      html, body { overscroll-behavior: none; }
      /* Node config overlays sit ON the node and are click-through: rgui natively
         makes the card background pass pointers to the canvas (so dragging it drags
         the node) and only lets real form controls capture — no CSS hack needed. */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
