<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>otoji</title>
    <style>
      /* Kill the default body margin so the full-bleed graph canvas (height:100vh)
         reaches every edge. Scrollable pages (classic app / lobby) keep normal flow. */
      html, body, #root { margin: 0; padding: 0; }
      /* Stop the touchpad two-finger horizontal pan from triggering the browser's
         back/forward swipe navigation. */
      html, body { overscroll-behavior: none; }
      /* Node config overlays sit ON the node: the card is click-through (dragging
         it drags the node), only real controls capture. */
      .rgui-node-cfg, .rgui-node-cfg * { pointer-events: none; }
      .rgui-node-cfg select, .rgui-node-cfg input, .rgui-node-cfg button,
      .rgui-node-cfg textarea, .rgui-node-cfg a { pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
