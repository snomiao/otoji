[package]
name = "otoji-app"
version = "0.1.16"
edition = "2021"
description = "otoji — fully-local SenseVoice ASR desktop app"
authors = ["snomiao <snomiao@gmail.com>"]
license = "MIT"

# Mark this directory as its own workspace root so cargo does not try to fold
# it into the parent `otoji` package directory.
[workspace]

[lib]
name = "otoji_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
