name: Meeting transcript SDK
on:
  pull_request:
    paths:
      - "packages/meeting-transcript/**"
      - ".github/workflows/meeting-transcript.yml"
  push:
    branches: [main]
    paths:
      - "packages/meeting-transcript/**"
      - ".github/workflows/meeting-transcript.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/meeting-transcript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
