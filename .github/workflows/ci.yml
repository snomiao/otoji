name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libasound2-dev pkg-config

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew install cmake || true

      - name: Install Windows build deps
        if: runner.os == 'Windows'
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        shell: pwsh

      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: bun install
        run: bun install --frozen-lockfile || bun install

      - name: Build native binding
        run: bun run build -- --target ${{ matrix.target }}
        shell: bash

      - name: Smoke-test the binding loads
        if: runner.os != 'Windows'
        run: |
          ls -la *.node
          bun -e 'const m = require("./index.js"); if (typeof m.polishText !== "function") { console.error("missing polishText"); process.exit(1); } console.log("ok:", Object.keys(m));'

      - name: Smoke-test the binding loads (Windows)
        if: runner.os == 'Windows'
        run: |
          dir *.node
          bun -e "const m = require('./index.js'); if (typeof m.polishText !== 'function') { console.error('missing polishText'); process.exit(1); } console.log('ok:', Object.keys(m));"
        shell: pwsh

      - name: Upload .node artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  cli-build:
    name: cargo build --bin otoji (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin otoji
