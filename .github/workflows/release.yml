name: release

# End-to-end release pipeline — releases are batched DAILY, not per-commit.
#
#   1. Conventional commits land on main. Each push only refreshes the
#      accumulating release PR (Cargo.toml + CHANGELOG bump) — it does NOT
#      build or publish, so a busy day costs one release cycle, not N.
#   2. Once a day (cron) — or on a manual `release_now` dispatch — the open
#      release PR is squash-merged and release-plz publishes the source crate
#      to crates.io (--no-verify, skipping the heavy sherpa-onnx-sys C++ build),
#      pushes a `vX.Y.Z` git tag, and emits the version as a job output.
#   3. The reusable _build.yml runs the cross-platform napi matrix.
#   4. The publish job lays out per-target sub-packages, syncs every
#      version field to the released version, and runs `npm publish
#      --provenance` for each `@otoji/core-<triple>` plus the umbrella
#      `@otoji/core` package via OIDC trusted publishing.
#
# Required secrets:
#   - CARGO_REGISTRY_TOKEN  (crates.io publish, used by release-plz)
#
# npm publishing uses OIDC — no NPM_TOKEN. Each `@otoji/core*` package on
# npmjs.com must have a Trusted Publisher pointing at this repo + this
# workflow file (https://docs.npmjs.com/trusted-publishers).
#
# Required repo settings:
#   Settings → Actions → General → Workflow permissions:
#     * Read and write permissions
#     * Allow GitHub Actions to create and approve pull requests

on:
  push:
    branches: [main]
  # Releases are batched DAILY rather than cut per-commit: every push only
  # refreshes the accumulating release PR; the scheduled run is what actually
  # merges it and publishes. This collapses ~N pushes/day into one build+publish
  # cycle (the full macOS/Windows/Linux napi matrix) instead of N of them.
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 03:00 JST — batch the day's commits overnight
  workflow_dispatch:
    inputs:
      force_npm:
        description: "Force npm build + publish even when release-plz didn't cut a new version"
        type: boolean
        default: false
      release_now:
        description: "Merge the open release PR and publish immediately (don't wait for the daily schedule)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─── Step 1: Cargo.toml bump + crates.io publish ──────────────────────
  release-plz:
    name: release-plz (crates.io)
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released_version: ${{ steps.released.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable

      - id: release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Merge the accumulated release PR — but only on the DAILY schedule (or a
      # manual release_now dispatch), NOT on every push. Pushes just keep the PR
      # up to date via release-pr above; this is the once-a-day batch point.
      - name: Auto-merge release PR
        if: |
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release_now))
          && steps.release-pr.outputs.prs != '' && steps.release-pr.outputs.prs != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number=$(echo '${{ steps.release-pr.outputs.prs }}' | jq -r '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            echo "Auto-merging release PR #$pr_number"
            gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --admin || \
              gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash
            # The action checked out main BEFORE this merge; sync to the merged
            # HEAD so the `release` step below sees the new version and publishes
            # it in THIS run (otherwise it lags to the next push, since a
            # GITHUB_TOKEN merge does not itself trigger a workflow run).
            git fetch origin main
            git reset --hard origin/main
          fi

      - id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - id: released
        name: Extract published version
        run: |
          set -euo pipefail
          version=$(echo '${{ steps.release.outputs.releases }}' | jq -r '.[0].version // empty')
          echo "Released version: '${version:-<none>}'"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ─── Step 2: cross-platform napi build (reusable matrix) ─────────────
  build:
    needs: release-plz
    if: |
      always() && (
        (needs.release-plz.result == 'success' && needs.release-plz.outputs.released_version != '')
        || (github.event_name == 'workflow_dispatch' && inputs.force_npm)
      )
    uses: ./.github/workflows/_build.yml

  # ─── Step 3: per-platform sub-packages + umbrella publish ────────────
  publish:
    name: publish to npm
    needs: [release-plz, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags for the version fallback below
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org

      # Skip the self-referential @otoji/core-* platform packages (not yet
      # published in this run); the built .node files come from download-artifact
      # below. bun still attempts (and fails) them even with --no-optional, but
      # the needed devDependencies install first, so tolerate the failure.
      - run: bun install --no-optional || true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Sync versions to released_version
        env:
          VERSION: ${{ needs.release-plz.outputs.released_version }}
        run: |
          set -euxo pipefail
          # On a normal release VERSION is the release-plz output. On a manual
          # workflow_dispatch (force_npm) it is empty — fall back to the latest
          # git tag (vX.Y.Z), NOT package.json (which release-plz never syncs and
          # is frozen at an ancient version → would regress the `latest` tag).
          if [ -z "${VERSION:-}" ]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          fi
          if [ -z "${VERSION:-}" ]; then
            echo "::error::could not determine a version to publish"; exit 1
          fi
          echo "Publishing version: $VERSION"
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = v;
            for (const k of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[k] = v;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            // Standalone `otoji` CLI launcher (zero-dep stdio bridge) rides the
            // same version line.
            const cliPath = "cli/package.json";
            if (fs.existsSync(cliPath)) {
              const cli = JSON.parse(fs.readFileSync(cliPath, "utf8"));
              cli.version = v;
              fs.writeFileSync(cliPath, JSON.stringify(cli, null, 2) + "\n");
            }
          '

      - name: Lay out per-platform npm/<triple>/ dirs
        run: |
          set -euxo pipefail
          npx --no-install napi create-npm-dir -t .
          npx --no-install napi artifacts -d artifacts
          ls -R npm
          # The umbrella @otoji/core ships the napi JS loader (index.js) so that
          # `require("@otoji/core")` resolves the matching @otoji/core-<triple>
          # optionalDependency. The loader is built (not committed) and is the
          # same for every target — grab one copy from the downloaded artifacts.
          loader=$(find artifacts -name index.js | head -1)
          test -n "$loader" || { echo "::error::no index.js in artifacts — umbrella would ship without its native loader"; exit 1; }
          cp "$loader" "$(dirname "$loader")/index.d.ts" .
          ls -la index.js index.d.ts

      # Resilient publish: a single missing or already-published subpackage must
      # not abort the rest (otherwise one un-bootstrapped platform freezes the
      # whole `@otoji/core` line — which is exactly what happened pre-0.1.41).
      # Re-publishing an existing version (403 "cannot publish over") is treated
      # as success; a 404 means the package name was never bootstrapped (OIDC
      # trusted-publishing cannot CREATE a package — do that once with a classic
      # automation token), and is surfaced as a warning without blocking peers.
      #
      # --ignore-scripts is essential for the umbrella `.`: its prepublishOnly
      # ("napi prepublish -t npm && npm run build:release") would otherwise try
      # to re-publish the platform packages (403, already published this run) and
      # rebuild the Rust binary on this publish-only runner — which froze the
      # umbrella at 0.1.1 while the sub-packages moved ahead. The sub-package and
      # cli dirs have no lifecycle scripts, so the flag is a no-op for them.
      - name: Publish to npm with provenance
        run: |
          set -uo pipefail
          fail=0
          publish() { # $1 = dir to publish from
            local dir="$1" out rc
            out=$(cd "$dir" && npm publish --access public --tag latest --provenance --ignore-scripts 2>&1); rc=$?
            echo "$out"
            [ $rc -eq 0 ] && return 0
            if echo "$out" | grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT"; then
              echo "::notice::$dir already published at this version — skipping"; return 0
            fi
            if echo "$out" | grep -qiE "E?404"; then
              echo "::warning::$dir is not on npm yet — bootstrap it once with a classic automation token (OIDC cannot create new packages)"
            else
              echo "::error::publish failed for $dir"
            fi
            return 1
          }
          for dir in npm/*/; do publish "$dir" || fail=1; done
          publish .   || fail=1   # umbrella @otoji/core
          publish cli || fail=1   # standalone `otoji` CLI launcher
          exit $fail
