name: release

# Single workflow that drives every release-related concern.
#
# Flow per version:
#   1. Conventional commits land on main.
#   2. `release-plz` opens a release PR (Cargo.toml + CHANGELOG bump).
#   3. PR merge → `release-plz` publishes the source crate to crates.io
#      (with --no-verify, so we don't pay for sherpa-onnx-sys C++ build
#       just to validate metadata) and pushes a `vX.Y.Z` tag.
#   4. The tag triggers the cross-platform napi build matrix.
#   5. After every platform builds, the publish job lays out per-target
#      sub-packages and runs `npm publish --provenance` for each plus
#      the umbrella `otoji` package.
#
# Required secrets:
#   - CARGO_REGISTRY_TOKEN  (crates.io publish, used by release-plz)
#
# npm publishing uses OIDC trusted publishing — no NPM_TOKEN needed.
# Each `otoji*` package on npmjs.com must have a Trusted Publisher
# configured (https://docs.npmjs.com/trusted-publishers) pointing at
# this repo + workflow file.
#
# Required repo settings:
#   - Settings → Actions → General → Workflow permissions:
#       * "Read and write permissions"
#       * "Allow GitHub Actions to create and approve pull requests"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_npm:
        description: "Force npm build + publish even if release-plz didn't cut a new version"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─── Step 1: bump Cargo.toml + publish source to crates.io ────────────
  release-plz:
    name: release-plz (crates.io)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released_version: ${{ steps.released.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: release-plz release
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Extract published version
        id: released
        run: |
          set -euo pipefail
          json='${{ steps.release.outputs.releases }}'
          echo "release-plz output: $json"
          if [ -z "$json" ] || [ "$json" = "null" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(echo "$json" | jq -r '.[0].version // empty')
          echo "Released version: '$version'"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ─── Step 2: cross-platform napi build ───────────────────────────────
  # Runs after release-plz cuts a new crates.io version, OR on manual
  # workflow_dispatch with `force_npm=true` (for re-running a failed
  # publish without re-bumping the crate version).
  build:
    name: build ${{ matrix.target }}
    needs: release-plz
    if: |
      always() && (
        (needs.release-plz.result == 'success' && needs.release-plz.outputs.released_version != '')
        || (github.event_name == 'workflow_dispatch' && inputs.force_npm)
      )
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libasound2-dev pkg-config

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Install Windows build deps
        if: runner.os == 'Windows'
        run: choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        shell: pwsh

      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - run: bun install
      - name: Build .node
        run: bun run build -- --target ${{ matrix.target }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  # ─── Step 3: publish per-platform npm packages + umbrella ─────────────
  publish:
    name: publish to npm
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "latest"
          registry-url: "https://registry.npmjs.org"

      - run: bun install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay out per-platform npm/<triple>/ directories
        run: |
          set -euxo pipefail
          ls -R artifacts
          npx --no-install napi create-npm-dir -t .
          npx --no-install napi artifacts -d artifacts
          ls -R npm

      # No NPM_TOKEN needed: npm OIDC trusted publishing auths via the
      # workflow's id-token. Each package on npmjs.com must have a
      # configured Trusted Publisher pointing at this repo + workflow.
      - name: Publish per-platform packages with provenance
        run: |
          set -euxo pipefail
          for dir in npm/*/; do
            (cd "$dir" && npm publish --access public --tag latest --provenance)
          done

      - name: Publish umbrella package with provenance
        run: |
          npm publish --access public --tag latest --provenance
