name: release-npm

# Tag pushes shaped like `vX.Y.Z` trigger a multi-platform napi build,
# collect every per-target `.node` artifact, and publish them to npm as
# the per-platform sub-packages plus the umbrella `otoji` package.
#
# Required secret: NPM_TOKEN (an npm automation token with publish rights
# on `otoji` and the per-platform `otoji-*` packages).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-14
            target: aarch64-apple-darwin
          - host: macos-13
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libasound2-dev pkg-config

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Install Windows build deps
        if: runner.os == 'Windows'
        run: choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        shell: pwsh

      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - run: bun install
      - name: Build .node
        run: bun run build -- --target ${{ matrix.target }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: bun install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move .node files into napi npm dirs
        run: |
          set -euxo pipefail
          ls -R artifacts
          # Create per-target subpackage scaffolding from package.json's `napi.triples`.
          npx --no-install napi create-npm-dir -t .
          # napi artifacts walks artifacts/<dir>/*.node and distributes them
          # into npm/<triple>/ based on the filename suffix.
          npx --no-install napi artifacts -d artifacts
          ls -R npm

      - name: Publish per-platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euxo pipefail
          for dir in npm/*/; do
            (cd "$dir" && npm publish --access public --tag latest) || \
              (cd "$dir" && npm publish --access public --tag latest --provenance false)
          done

      - name: Publish umbrella package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public --tag latest
