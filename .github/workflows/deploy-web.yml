name: deploy-web

# Auto-deploy the web app (web/) to Cloudflare Pages on every push to main that
# touches it. Builds from a clean checkout (no .env*.local present), so a local
# dev override can never leak into production — and prod never lags main.
#
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "lib/rgui" # submodule bumps change the shipped renderer
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: # allow manual re-deploys

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # submodules: the web build consumes @snomiao/rgui SOURCE from lib/rgui;
      # without the submodule the vite alias falls back to a read-only stub.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # bun, not pnpm: web/ declares packageManager bun@1.3.13 and ships
      # bun.lock — corepack refuses the spec and pnpm has no lockfile here.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      # vite only: ci.yml owns typechecking; the deploy must not be blocked by
      # a stray type error while prod lags main.
      # Invoke the LOCAL vite entry — `bun x vite` falls back to fetching
      # vite@latest (a different major) when the bin isn't linked, which is
      # exactly what broke the previous run.
      - name: Build
        run: node node_modules/vite/bin/vite.js build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=otoji --branch=main
