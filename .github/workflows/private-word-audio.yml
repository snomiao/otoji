name: Private word audio SDK
on:
  pull_request:
    paths: ["packages/private-word-audio/**", ".github/workflows/private-word-audio.yml"]
  push:
    branches: [main]
    paths: ["packages/private-word-audio/**", ".github/workflows/private-word-audio.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun test packages/private-word-audio/test
