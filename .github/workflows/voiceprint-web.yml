name: Browser voiceprint SDK
on:
  pull_request:
    paths:
      - "packages/voiceprint-web/**"
      - "web/src/lib/fbank.ts"
      - ".github/workflows/voiceprint-web.yml"
  push:
    branches: [main]
    paths:
      - "packages/voiceprint-web/**"
      - "web/src/lib/fbank.ts"
      - ".github/workflows/voiceprint-web.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/voiceprint-web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Install existing web app dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Existing web regression tests
        working-directory: web
        run: node node_modules/vitest/vitest.mjs run
