[workspace]
resolver = "2"
members = [
    "crates/otoji-core",
    "crates/otoji-audio",
    "crates/otoji-asr",
    "crates/otoji-tts",
    "crates/otoji-polish",
    "crates/otoji-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["snomiao <snomiao@gmail.com>"]
repository = "https://github.com/snomiao/otoji"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"
url = "2"
urlencoding = "2"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
ratatui = "0.28"
crossterm = "0.28"
cpal = "0.15"
clap = { version = "4", features = ["derive", "env"] }
hound = "3.5"
chrono = "0.4"

otoji-core = { path = "crates/otoji-core" }
otoji-audio = { path = "crates/otoji-audio" }
otoji-asr = { path = "crates/otoji-asr" }
otoji-tts = { path = "crates/otoji-tts" }
otoji-polish = { path = "crates/otoji-polish" }
